# Evaluation set. Relevance is defined by rules over structured data and review text (Oracle Text),
# never by embeddings, so the labels are independent from the models being evaluated.
#
# relevant:
#   categories: any of these categories
#   tags: all of these tags (ambience, meal, music)
#   features: all of these boolean columns are true
#   wifi, price_max, price_min: attribute filters
#   mentions: each entry needs at least `min` reviews matching the Oracle Text query `text`
#   near + radius_km: within the radius of a neighborhood
# expected_filters: what the AI should extract from the question. A scalar may be a list of acceptable values
#   (null in the list means leaving it empty is also fine); an omitted field must stay empty.
# optional: tags or features the AI may add without being penalized

- id: live_jazz
  question: late night spot with live jazz and cocktails
  relevant:
    mentions: [{text: "jazz", min: 5}]
    tags: [live]
  expected_filters: {category: [Jazz & Blues, Music Venues, Cocktail Bars, Bars, Nightlife, null]}
  optional: {tags: [live, latenight]}

- id: cheap_pizza
  question: cheap pizza
  relevant: {categories: [Pizza], price_max: 1}
  expected_filters: {price_max: 1, category: [Pizza, null]}

- id: date_pasta
  question: cozy place for a date with good pasta
  relevant:
    mentions: [{text: "pasta", min: 15}, {text: "date OR romantic OR anniversary", min: 5}]
  expected_filters: {category: [Italian, null]}
  optional: {tags: [romantic, intimate]}

- id: laptop_cafe
  question: quiet cafe where I can work on my laptop
  relevant:
    categories: [Cafes, Coffee & Tea]
    wifi: free
    mentions: [{text: "laptop OR {work from} OR studying", min: 3}]
  expected_filters: {free_wifi: true, category: [Cafes, Coffee & Tea, null]}

