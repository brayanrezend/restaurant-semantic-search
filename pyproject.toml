[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/rss/assistant.py" = ["E501"]
"src/rss/demo.py" = ["E501"]
